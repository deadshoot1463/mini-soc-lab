# =============================================================================
# suricata — IDS (détection d'intrusion) réseau
# -----------------------------------------------------------------------------
# Partage le network namespace de `victime` (sidecar) pour voir le trafic
# kali → victime sur worker_lan. Sur un bridge Docker classique, un conteneur
# AF_PACKET isolé ne voit PAS le trafic entre deux autres conteneurs.
#
# Les logs restent sur volume ./suricata/logs (lus par Filebeat via bind-mount).
# =============================================================================

services:
  suricata:
    image: jasonish/suricata:8.0.7
    container_name: suricata
    # pas de hostname : incompatible avec network_mode: service:*

    # Capacités Linux nécessaires à la capture de paquets (AF_PACKET)
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE

    # Sidecar victime : voit toutes les connexions vers/depuis 10.30.10.20
    network_mode: "service:victime"
    depends_on:
      - victime

    volumes:
      # Config principale (suricata.yaml, classification, etc.)
      - ./suricata/config:/etc/suricata
      # Règles de détection (suricata.rules, …)
      - ./suricata/rules:/var/lib/suricata/rules
      # Sortie des logs (eve.json, fast.log, …) → lue par Filebeat
      - ./suricata/logs:/var/log/suricata

    command:
      # eth0 = interface worker_lan de la victime (namespace partagé)
      - -c
      - /etc/suricata/suricata.yaml
      - --af-packet=eth0

    restart: unless-stopped
