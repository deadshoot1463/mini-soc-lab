# =============================================================================
# setup-passwords — synchronisation du mot de passe kibana_system
# -----------------------------------------------------------------------------
# Conteneur "one-shot" lancé après qu'Elasticsearch soit healthy.
#
# Pourquoi ?
#   - Kibana se connecte à ES avec le user built-in "kibana_system"
#   - Au 1er démarrage, ES crée ce user avec un mot de passe ALÉATOIRE
#   - Ce service force le mot de passe à la valeur de KIBANA_PASSWORD (.env)
#     pour que Kibana puisse s'authentifier.
#
# Sans cette étape : Kibana démarre mais échoue à joindre Elasticsearch.
#
# Script : ./scripts/setup-passwords.sh
# =============================================================================

services:
  setup-passwords:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: setup-passwords
    user: "0"

    environment:
      # Compte admin pour appeler l'API _security
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      # Nouveau mot de passe à appliquer à kibana_system
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}

    command: ["bash", "/scripts/setup-passwords.sh"]

    volumes:
      # CA uniquement (lecture) pour valider le certificat HTTPS d'ES
      - ./certs:/certs:ro
      - ./scripts/setup-passwords.sh:/scripts/setup-passwords.sh:ro

    networks:
      - elk_lan

    depends_on:
      elasticsearch:
        condition: service_healthy

    # Ne redémarre pas : job d'init, pas un service permanent
    restart: "no"

networks:
  elk_lan:
    external: true
    name: elk_lan
