# =============================================================================
# filebeat — agent de collecte / envoi des logs vers Elasticsearch
# -----------------------------------------------------------------------------
# Lit les événements Suricata (./suricata/logs/eve.json) et les indexe dans ES.
# Image custom construite depuis ./filebeat (Dockerfile + filebeat.yml).
# =============================================================================

services:
  filebeat:
    build: ./filebeat
    container_name: filebeat
    hostname: FILEBEAT

    # root : lecture des logs Suricata + écriture registry Filebeat
    user: root
    # Override du CMD de l'image officielle :
    #   "-environment container" (un seul tiret) casse Filebeat 8.x
    # --strict.perms=false : assouplit le check de permissions sur filebeat.yml
    command: ["-e", "--environment", "container", "--strict.perms=false"]

    environment:
      # Injectés dans filebeat.yml via ${...}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      KIBANA_USERNAME: ${KIBANA_USERNAME}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD}

    volumes:
      # Source des logs IDS (écrits par le conteneur Suricata)
      - ./suricata/logs:/var/log/suricata:ro
      # CA pour valider HTTPS vers ES / Kibana
      - ./certs:/usr/share/filebeat/certs:ro

    networks:
      - elk_lan

    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started

    restart: unless-stopped

networks:
  elk_lan:
    external: true
    name: elk_lan
