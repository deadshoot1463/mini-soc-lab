# =============================================================================
# Point d'entrée de la stack mini-SOC (ELK + Suricata + Filebeat + Offensif)
# -----------------------------------------------------------------------------
# Ce fichier assemble les compose "enfants" via `include`.
#
# Lancer toute la stack :
#   docker compose up -d --build
# =============================================================================

name: mini-soc-run

include:
  # --- ELK / détection ---
  - ELK-CONFIG/docker-compose.setup-certs.yml
  - ELK-CONFIG/docker-compose.elasticsearch.yml
  - ELK-CONFIG/docker-compose.setup-passwords.yml
  - ELK-CONFIG/docker-compose.kibana.yml
  - ELK-CONFIG/docker-compose.filebeat.yml
  - ELK-CONFIG/docker-compose.suricata.yml
  - ELK-CONFIG/docker-compose.n8n.yml

  # --- Lab offensif (attaquant + cible) ---
  - OFFENSIF-CONFIG/docker-compose.kali.yml
  - OFFENSIF-CONFIG/docker-compose.victime.yml
