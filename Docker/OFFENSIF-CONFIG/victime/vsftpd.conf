listen=YES
listen_ipv6=NO

# Accès anonyme activé (volontairement vulnérable)
anonymous_enable=YES
anon_root=/var/ftp
no_anon_password=YES
anon_upload_enable=NO
anon_mkdir_write_enable=NO

# Accès local
local_enable=YES
write_enable=YES
local_umask=022

# Logs (utile pour Suricata/Filebeat)
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES

# Pas de chroot pour simplifier les tests
chroot_local_user=NO

dirmessage_enable=YES
use_localtime=YES
connect_from_port_20=YES

# Mode passif pour Docker
pasv_enable=YES
pasv_address=10.30.10.20
pasv_min_port=40000
pasv_max_port=40100
